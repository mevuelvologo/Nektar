<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nektar Bambú — Instrumentos, luminarias y artesanías de bambú</title>
<meta name="description" content="Instrumentos musicales, luminarias y artesanías 100% bambú. Armá tu pedido y coordinalo directo por WhatsApp.">
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
<link rel="icon" type="image/png" href="assets/logo/favicon.png">
<link rel="apple-touch-icon" href="assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== 1. ENCABEZADO ===================== -->
<header class="site-header">
  <a href="#" class="logo" data-action="go-home" aria-label="Volver al inicio">
    <img src="assets/logo/wordmark.svg" alt="Nektar Bambú .com.ar" class="logo-img">
  </a>

  <button class="cart-pill" data-action="open-pedido" aria-label="Ver pedido">
    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 4h2l1.6 9.6a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L20 8H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/>
      <circle cx="16.5" cy="19.5" r="1.4" fill="currentColor"/>
    </svg>
    <span class="cart-count" id="cart-count" hidden>0</span>
    <span class="cart-subtotal" id="cart-subtotal">$0</span>
  </button>
</header>

<!-- ===================== 2. MÓDULO INTERACTIVO ===================== -->
<section class="interactive" id="interactive" aria-live="polite">
  <!-- Su contenido lo arma app.js según el estado: bienvenida | pedido | info -->
</section>

<!-- ===================== 3. ÍTEMS ===================== -->
<section class="catalog">
  <aside class="filters" id="filters" aria-label="Filtros de categoría">
    <span class="filters-label">Filtros</span>
    <div class="filters-list" id="filters-list"></div>
  </aside>

  <div class="grid" id="grid" role="list"></div>
</section>

<!-- ===================== 4. TEXTO INFORMATIVO ===================== -->
<section class="showroom-text">
  <h2 id="showroom-title"></h2>
  <div class="showroom-body" id="showroom-body"></div>
</section>

<!-- ===================== 5. FOOTER ===================== -->
<footer class="site-footer">
  <p class="footer-envios">Envíos a CABA y GBA en el día, encomienda a todo el país</p>
  <div class="footer-links">
    <a id="footer-whatsapp" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4 0-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 4 3.5.6.2 1 .4 1.3.5.6.2 1.1.1 1.5-.1.5-.2 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.4-.3Z"/></svg>
    </a>
    <a id="footer-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
    </a>
    <a id="footer-youtube" href="#" target="_blank" rel="noopener" aria-label="YouTube">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.4v5.2l4.6-2.6z" fill="currentColor" stroke="none"/></svg>

    <a id="footer-maps" href="#" target="_blank" rel="noopener" aria-label="Ubicación">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>

<audio id="audio-player" preload="none"></audio>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
